version: '3.8'

# Compose project (stack) name. Without this it defaults to the folder name
name: homestew

services:
  homestew:
    build: .
    image: homestew
    container_name: homestew
    ports:
      - "8000:8000"
    volumes:
      # Persistent data storage (PDFs, database)
      - ./data:/data
    # Uncomment so webhook URLs can target services running on the host via
    # http://host.docker.internal:<port>. Modern Docker Desktop already
    # provides this name natively; it is required on Linux Docker engines.
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    environment:
      # LLM Configuration - adjust based on your setup
      - LLM_BASE_URL=http://localhost:11434/v1  # Ollama default
      # No API key needed for local servers (a dummy is used automatically).
      # Uncomment to configure one, e.g. for hosted providers:
      # - LLM_API_KEY=sk-your-api-key
      - LLM_MODEL=llama3.2  # Change to your preferred model
      
      # Optional: Override with your settings
      # - LLM_BASE_URL=https://api.openai.com/v1
      # - LLM_API_KEY=sk-your-api-key
      # - LLM_MODEL=gpt-4o-mini
    
    restart: unless-stopped
    
    # Resource limits (optional, adjust based on your hardware)
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

# Optional: Add an LLM service if running Ollama locally
# Uncomment if you want to run everything in one compose file
