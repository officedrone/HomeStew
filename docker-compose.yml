# Compose project (stack) name. Without this it defaults to the folder name
name: homestew

# Encryption of API keys/tokens in /data/settings.json: on first start a
# one-time wizard offers to generate a random master key at
# /data/.secrets_key (mode 0600) inside the homestew_data volume. Include
# that file in volume backups; without it, stored secrets cannot be
# decrypted. Manage or delete the key later under Settings > Advanced.
#
# Optional hardening: keep the master key OUTSIDE the data volume by
# generating your own key file once and uncommenting the block below (and
# the `secrets:` entry under the service). A mounted key file always wins
# over a HomeStew-managed one. See README "Secrets".
#   Linux/macOS:  mkdir -p secrets && openssl rand -base64 32 > secrets/homestew_secret_key
#   PowerShell:   mkdir secrets; [IO.File]::WriteAllBytes("secrets\homestew_secret_key", (1..32 | ForEach-Object { Get-Random -Maximum 256 }))
# secrets:
#   homestew_secret_key:
#     file: ./secrets/homestew_secret_key

services:
  homestew:
    build: .
    image: homestew
    container_name: homestew
    ports:
      - "8000:8000"
    volumes:
      # Persistent data storage (PDFs, database, settings.json and the
      # secrets master key /data/.secrets_key once created). A named volume
      # keeps it out of the repo checkout - no accidental commits.
      - homestew_data:/data
    # secrets:
    #   - homestew_secret_key  # only with the commented `secrets:` block above
    # Uncomment so webhook URLs can target services running on the host via
    # http://host.docker.internal:<port>. Modern Docker Desktop already
    # provides this name natively; it is required on Linux Docker engines.
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    environment:
      # LLM Configuration - adjust based on your setup
      - LLM_BASE_URL=http://localhost:11434/v1  # Ollama default
      # No API key needed for local servers (a dummy is used automatically).
      # Uncomment to configure one, e.g. for hosted providers:
      # - LLM_API_KEY=sk-your-api-key
      - LLM_MODEL=llama3.2  # Change to your preferred model
      
      # Optional: Override with your settings
      # - LLM_BASE_URL=https://api.openai.com/v1
      # - LLM_API_KEY=sk-your-api-key
      # - LLM_MODEL=gpt-4o-mini
    
    restart: unless-stopped

    # Container health check (issue #9). This block overrides the HEALTHCHECK
    # baked into the image so the probe interval is configurable WITHOUT a
    # rebuild - docker compose reads it from your shell env or a .env file:
    #   PowerShell:  $env:HEALTHCHECK_INTERVAL="120s"; docker compose up -d
    #   Linux/macOS: HEALTHCHECK_INTERVAL=120s docker compose up -d
    # The command mirrors the Dockerfile's stdlib-only probe on purpose: the
    # old `import requests` healthcheck re-imported a heavy package every
    # 30 s inside the container, which WAS the periodic idle CPU spike.
    healthcheck:
      interval: ${HEALTHCHECK_INTERVAL:-300s}
      timeout: 10s
      retries: 3
      start_period: 15s
      test: ["CMD-SHELL", "python -c \"import sys,http.client as h; r=h.HTTPConnection('127.0.0.1',8000,timeout=5); r.request('GET','/health'); sys.exit(0 if r.getresponse().status==200 else 1)\""]
    
    # Resource limits (optional, adjust based on your hardware)
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

volumes:
  homestew_data:

# Optional: Add an LLM service if running Ollama locally
